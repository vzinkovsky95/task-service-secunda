# Публикует статическую документацию API на GitHub Pages: страница Swagger UI из
# site/index.html и спецификация api/openapi.yaml. Запросы со страницы не
# выполняются (Try it out отключён), это справочник.
# Действия закреплены по полному SHA коммита (checkout v7.0.1, configure-pages
# v6.0.0, upload-pages-artifact v5.0.0, deploy-pages v5.0.1).

name: Pages

on:
  push:
    branches: [main]
    paths:
      - api/openapi.yaml
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Assemble the site
        run: |
          mkdir _site
          cp site/index.html _site/index.html
          cp api/openapi.yaml _site/openapi.yaml
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
