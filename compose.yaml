name: tasksvc

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    command:
      - --character-set-server=utf8mb4
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
      - --max-connections=40
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set in .env}
      MYSQL_USER: ${MYSQL_USER:?set in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:?set in .env}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "32mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "127.0.0.1:${REDIS_PORT:?set in .env}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      JWT_TTL: ${JWT_TTL:-24h}
      REDIS_ADDR: redis:6379
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set in .env}
      MYSQL_USER: ${MYSQL_USER:?set in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:${APP_PORT:?set in .env}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  tools:
    image: golang:1.26
    profiles: ["tools"]
    mem_limit: 768m
    cpus: 1
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /src
    environment:
      GOFLAGS: -buildvcs=false
      GOCACHE: /go/cache
      HOME: /tmp
    volumes:
      - .:/src
      - gocache:/go

volumes:
  mysql-data:
  gocache:
